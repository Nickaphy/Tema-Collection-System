services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Actually checks SQL Server can accept a query, not just that the
      # container process started - that's the whole fix for the race.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: WatchWorld.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Mother: "Server=${MOTHER_LAN_IP:-192.168.0.236},1433;Database=WatchWorld;User Id=sa;Password=${MOTHER_SA_PASSWORD:-};TrustServerCertificate=True;Connect Timeout=3;"
      ConnectionStrings__Local: "Server=sqlserver,1433;Database=WatchWorld;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      SeedFullCatalog: "${SEED_FULL_CATALOG:-false}"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
